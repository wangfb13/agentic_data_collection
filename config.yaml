# All experimental lengths are mm, angles degrees, forces N, times seconds.
# TODO values are unmeasured. --demo selects an entirely synthetic configuration.
# No camera other than the two wrist streams is configured or recorded.
schema_version: 2
demo: false
units: {distance: mm, angle: deg, force: N, time: s}
grasp_mode: side
# PLACEHOLDER_1: teleoperate to ideal open grasp, then record measured TCP T0.
T0: TODO_PLACEHOLDER_1_measured_TCP_base_link_4x4_mm
tool:
  # G: sensor-face midpoint in TCP xyz mm; use a 4x4 translation, rotation I.
  grasp_center_in_tcp: TODO_measured_4x4_TCP_to_sensor_face_midpoint
  grasp_center_evidence: TODO_URDF_CAD_or_measurement_source_and_method
zero_guard:
  sample_count: 100
  timeout_s: 8
  force_std_max: TODO_measured_unloaded_force_std_limit
  dd_contact_threshold: TODO_measured_DD_contact_residual_threshold
  dd_contact_max_fraction: TODO_measured_allowed_contact_pixel_fraction
  offset_delta_warn: TODO_measured_zero_offset_change_warning
preparation:
  height_crosscheck_tolerance_mm: TODO_accepted_height_difference_mm
  # PLACEHOLDER_2: measured safe free-space TCP pose for the 5 mm axis checks.
  axis_test_pose: TODO_PLACEHOLDER_2_free_space_TCP_base_link_4x4_mm
# PLACEHOLDER_4: confirm the signed local axes by 5 mm manual/single-step motions.
axes:
  a: TODO_PLACEHOLDER_4_approach_axis_TCP
  c: TODO_PLACEHOLDER_4_closure_axis_TCP
  l: TODO_PLACEHOLDER_4_lateral_axis_TCP
geometry:
  bottle:
    axis: l
    center_offset_mm: TODO_bottle_axis_origin_in_T0_TCP_xyz
    segments:
      - {name: body, radius_mm: TODO, axial_min_mm: TODO, axial_max_mm: TODO}
      - {name: neck, radius_mm: TODO, axial_min_mm: TODO, axial_max_mm: TODO}
      - {name: cap, radius_mm: TODO, axial_min_mm: TODO, axial_max_mm: TODO}
  gripper:
    finger_size_acl_mm: TODO_outer_finger_dimensions_a_c_l
    finger_center_a_mm: TODO
    finger_center_l_mm: TODO
    palm_center_acl_mm: TODO
    palm_size_acl_mm: TODO
    pad_depth_mm: TODO_allowed_soft_pad_volume_depth
    pad_size_al_mm: TODO_centered_soft_pad_size_a_l
safety:
  # PLACEHOLDER_3: measure table and safe workspace, including gripper extents.
  workspace_min_mm: TODO_PLACEHOLDER_3
  workspace_max_mm: TODO_PLACEHOLDER_3
  table_z_mm: TODO_PLACEHOLDER_3
  margin_mm: TODO
  max_step_mm: TODO
  max_rotation_step_deg: TODO
  path_step_mm: 2
  path_step_deg: 2
  cylinder_sides: 32
motion:
  free_speed_mm_s: TODO
  near_speed_mm_s: TODO
  lift_speed_mm_s: TODO
  angular_speed_deg_s: TODO
  pose_tolerance_mm: TODO
  pose_tolerance_deg: TODO
  near_distance_mm: 50
  lift_height_mm: 50
  pre_distance_mm: 50
  settle_s: 0.3
  hold_s: 2
  stage_timeouts_s:
    MOVE_PRE: TODO
    APPROACH: TODO
    CLOSE: TODO
    PROBE: TODO
    SQUEEZE: TODO
    LIFT: TODO
    HOLD: TODO
    LOWER: TODO
    RELEASE: TODO
    RETREAT: TODO
    CHECK: TODO
    LABEL: TODO
    VISUAL_MOVE: TODO
    VISUAL_CAPTURE: TODO
    BASELINE: TODO
force:
  controller: bridge_loop
  target_definition: mean
  unit: sdk
  validation:
    repetitions: 10
    hold_s: 2.0
    report_path: outputs/validation/force_report.json
    evaluation_target: TODO_measured_39020_evaluation_target
    max_contact_peak: TODO_accepted_contact_peak
    max_settle_s: TODO_accepted_force_settle_s
    max_steady_std: TODO_accepted_steady_force_std
  contact_min_N: TODO
  target_N: TODO
  probe_fraction: 0.3
  max_N: TODO
  target_tolerance_N: TODO
  stable_s: 0.5
  probe_s: 0.3
  squeeze_mode: fixed
gripper:
  open_mm: TODO
  min_mm: TODO_minimum_bottle_diameter_minus_confirmed_margin
  open_tolerance_mm: TODO
  close_speed_mm_s: TODO
  stall_window_s: 0.3
  stall_epsilon_mm: TODO
  geometry_width_step_mm: 1
design:
  bottle_axis_range_mm: TODO_lower_body_through_above_cap
  bottle_axis_step_mm: 5
  other_axis_range_mm: [-20, 20]
  other_axis_step_mm: 5
  closure_offsets_mm: [-8, -4, 0, 4, 8]
  tilt_degrees: [-10, -5, 0, 5, 10]
  repeats: 2
  seed: 20261026
  zero_every: 10
  baseline_every: 30
  bottles: [light, heavy]
visual:
  count: 400
  seed: 20261026
  orbit_deg: [-20, 20]
  a_range_mm: [-80, 0]
  c_range_mm: [-20, 20]
  l_range_mm: [-30, 30]
  tilt_deg: [-10, 10]
  settle_s: 0.3
check:
  retreat_mm: 80
  # Explicit calibration mode: allowed only while preparing a session. Trial
  # execution requires the two measured numeric thresholds saved by preparation.
  threshold_px: calibrate_at_session_start
  min_score: TODO_confirm_template_quality_threshold
  calibration_mm: 2
  calibration_fraction: 0.8
  search_radius_px: TODO
tactile:
  centroid_drift_px: TODO_measured_centroid_drift_px
  pixel_pitch_mm: unavailable # Unknown physical pixel pitch; output pixels only.
  depth_channel: TODO_raw_DD_depth_channel
  dd_threshold: TODO_raw_DD_units
  centroid_drift_mm: unavailable # Inactive while pixel pitch is unavailable.
  sensor_to_tcp: {left: TODO_3x3_rotation, right: TODO_3x3_rotation}
  normal_axis: TODO
  normal_signs: TODO_left_right
  dd_shape: TODO_raw_tensor_shape
  dd_dtype: TODO_verified_raw_SDK_numpy_dtype
  dd_unit: TODO_SDK_physical_unit
  fps: TODO_measured
  baseline_s: 10
  edge_pixels: 3
  force_unit: TODO_confirm_calibrated_N
  moment_unit: TODO_Nmm_or_Nm
  cop_plane_z_mm: unavailable # CoP remains NaN until measured.
analysis:
  dd_threshold: TODO_raw_DD_units
  edge_width_px: 3
  max_stream_skew_s: 0.1
  max_pose_command_age_s: 0.2
  centroid_to_al: {left: TODO_2x2_measured_mapping, right: TODO_2x2_measured_mapping}
cameras:
  left_wrist: {fps: TODO_measured, width: TODO, height: TODO, mount: TODO}
  right_wrist: {fps: TODO_measured, width: TODO, height: TODO, mount: TODO}
hardware:
  backend: TODO_verified_adapter
  bridge_module: hardware_bridge_template
  # The template's CAPABILITIES remain false; this name does not enable hardware.
  sensor_serials: {left: TODO_verified_left_sensor, right: TODO_verified_right_sensor}
  pose_unit: TODO_confirm_ROS_m
  quaternion_order: xyzw
  base_frame: base_link
  tcp_definition: TODO_confirm_measured_v2_or_actual_transform
  arm_side: TODO
  stop_verified: TODO_actual_hardware_stop_API
  linear_path_verified: TODO_not_endpoint_pose_publish
  cartesian_speed_verified: TODO_not_base_velocity
  gripper_width_calibration: TODO_counts_to_physical_mm
  force_calibration: TODO_raw_SDK_to_N
  camera_mounts_declared: TODO_verify_both_wrist_views_repeat_at_T_check
  axis_mapping_declared: TODO
  sensor_mapping_declared: TODO
  public_ros:
    command_ownership:
      infrastructure_output_policy: strict
      topics: [/wbc_goal_pose, /joint_control, /joint_commands, /left_gripper_command, /right_gripper_command]
      timeout_s: 3.0
output: {root: outputs, compression: gzip, jpeg_quality: 95}
recording:
  # Offline synthetic load only; these are not measured camera/force rates.
  stress:
    duration_s: 1.0
    control_hz: 200.0
    producer_hz: 30.0
    dd_hz: 27.0
    force_hz: 30.0
    write_delay_s: 0.05
    max_added_p95_s: 0.01
    image_shape: [1080, 1920, 3]
  writer:
    queue_bytes: 134217728
    queue_items: 4096
    startup_timeout_s: 15.0
    close_timeout_s: 30.0
  control_hz: 20
  stale_timeout_s: 0.25
  source_max_age_s: 0.25
estimated_bytes_per_image: TODO_measured
sample_hz: TODO_measured

close:
  detection_frames: 2
  observed_force_fps: TODO_measured_force_fps
  observed_dd_fps: TODO_measured_DD_fps
  max_overtravel_mm: TODO_accepted_overtravel_mm
  width_resolution_mm: TODO_measured_width_resolution_mm
stop_test:
  distance_mm: 50.0
  repeats: 3
  direction_base: TODO_unit_direction_base
  trigger_s: TODO_measured_trigger_s
  settle_window_s: TODO_measured_settle_window_s
  settle_translation_mm: TODO_measured_position_noise_mm
  settle_rotation_deg: TODO_measured_rotation_noise_deg
  timeout_s: TODO_stop_observation_timeout_s
  max_extra_mm: TODO_accepted_extra_displacement_mm
  sample_hz: 100.0
  command_quiet_s: 0.25
  report_path: outputs/validation/stop_report.json
probe:
  settle_s: 0.2
  timeout_s: 3.0
  window_frames: 5
hold:
  window_s: 0.5
lower:
  unload_ratio: 0.2
  vertical_mapping_confirmed: false

park_guard:
  translation_mm: 1.0
  rotation_deg: 0.5
  joint_topic: /joint_states
  joint_names:
    left:
    - arm_left_1_joint
    - arm_left_2_joint
    - arm_left_3_joint
    - arm_left_4_joint
    - arm_left_5_joint
    - arm_left_6_joint
    - arm_left_7_joint
    right:
    - arm_right_1_joint
    - arm_right_2_joint
    - arm_right_3_joint
    - arm_right_4_joint
    - arm_right_5_joint
    - arm_right_6_joint
    - arm_right_7_joint
  mapping_evidence: Existing Spark adapter schema plus read-only /joint_states observation
    on 2026-10-27
record:
  gel_raw: windows

opening_repeat:
  repetitions: 10
  report_path: outputs/validation/opening_report.json

simulation:
  # Synthetic recording playback only; real control and wall-clock stress are separate.
  max_speedup: 2
