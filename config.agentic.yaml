schema: agentic_campaign_config_v1
base_config: config.e1e2.yaml
seed_sessions: []
planning:
  # New campaigns: the Agent writes complete batches; local suggestions are optional.
  # Existing campaign.json files without this section keep candidate selection.
  mode: agent
  max_attempts: 3
provider:
  backend: chatgpt
  model: null
  callback_port: 8766
  login_timeout_s: 600
  open_browser: false
  request_timeout_s: 120
  proxy: http://127.0.0.1:18082
scope:
  adaptive: true
  # Immutable execution envelope; the agent changes its working range within it.
  min_mm: -25.0
  max_mm: 25.0
  # Cold-start fallback only; compatible measured A data determines the start.
  initial_min_mm: -2.0
  initial_max_mm: 10.0
  step_mm: 2.0
  min_step_mm: 0.5
  expansion_step_mm: 5.0
  allow_expand: true
budget:
  max_trials: 120
  max_batches: 10
  max_seconds: 14400
  batch_trials: 12
learning:
  min_per_level: 2
  min_levels: 3
  target_mae_mm: 1.0
  target_p90_mm: 2.0
  min_gain_mm: 0.1
  plateau_batches: 2
  min_B_batches: 1
  min_B_per_cell: 1
policy:
  gains: [0.5, 0.75, 1.0]
validation:
  adaptive_scope: true
  points: 5
  # Legacy fallback; adaptive campaigns freeze 5 points in their final range.
  offsets_mm: [-2, 0, 2, 6, 10]
  reps: 4
  success_target: 0.8
approval: campaign
seed: 20261030
